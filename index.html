<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidikon</title>
    <meta name="description" content="Vidikon is a player for your own IPTV provider on iPhone, iPad and Apple TV.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="canonical" href="https://octoent.com/vidikon-legal/">
    <meta property="og:title" content="Vidikon">
    <meta property="og:description" content="A player for your own IPTV provider on iPhone, iPad and Apple TV.">
    <meta property="og:url" content="https://octoent.com/vidikon-legal/">
    <meta property="og:type" content="website">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #0a0a0f;
            color: #fefeff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
        }
        main {
            min-height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px 100px;
        }
        h1 { font-size: 3em; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
        p.tagline { font-size: 1.25em; color: rgba(255,255,255,0.7); max-width: 520px; line-height: 1.5; }
        p.note { margin-top: 28px; font-size: 0.95em; color: rgba(255,255,255,0.45); max-width: 520px; line-height: 1.5; }
        footer {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            height: 60px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        .brand { font-weight: 600; color: rgba(255,255,255,0.85); text-decoration: none; }
        .footer-nav { display: flex; gap: 24px; }
        .footer-nav a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; }
        .footer-nav a:hover { color: #fff; }
        @media (max-width: 600px) {
            h1 { font-size: 2.2em; }
            footer { padding: 0 16px; height: 56px; }
            .footer-nav { gap: 16px; }
            .footer-nav a { font-size: 13px; }
            main { min-height: calc(100vh - 56px); }
        }
    </style>
</head>
<body>
    <main>
        <h1>Vidikon</h1>
        <p class="tagline">A player for your own IPTV provider, on iPhone, iPad and Apple TV.</p>
        <p class="note">Vidikon does not provide, host or sell any content. You connect the provider you already have.</p>
    </main>
    <footer>
        <a class="brand" href="index.html">Vidikon</a>
        <nav class="footer-nav">
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="mailto:vlad@octoent.com">Contact</a>
        </nav>
    </footer>
</body>
</html>
